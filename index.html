
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b08">
<title>NOVA-IA</title>

<style>
:root {
  --bg: #080d0b;
  --panel: #101713;
  --panel2: #17211b;
  --green: #36e982;
  --text: #f1f5f2;
  --muted: #a1ada5;
  --border: #28352d;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, Arial, sans-serif;
  height: 100dvh;
  overflow: hidden;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
#matrix {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: .13;
  pointer-events: none;
  z-index: 0;
}
.app {
  position: relative;
  z-index: 1;
  height: 100dvh;
  display: flex;
  overflow: hidden;
}
.sidebar {
  width: 255px;
  flex-shrink: 0;
  background: rgba(10,16,12,.97);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 21px;
  letter-spacing: 1px;
  padding: 8px 2px 18px;
}
.logo {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid var(--green);
  border-radius: 12px;
  color: var(--green);
  box-shadow: 0 0 15px #36e98222;
}
button {
  color: var(--text);
  border: 1px solid var(--border);
  background: var(--panel2);
  border-radius: 10px;
  padding: 10px 12px;
  transition: .15s;
}
button:hover { border-color: var(--green); }
button:active { transform: scale(.98); }
.primary {
  background: var(--green);
  color: #041008;
  border-color: var(--green);
  font-weight: 750;
}
.primary:hover { background: #68f5a2; }
.section-label {
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 12px;
}
#history {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.history-item {
  display: flex;
  align-items: center;
  gap: 4px;
  text-align: left;
  min-width: 0;
  background: transparent;
  border-color: transparent;
  padding: 9px;
}
.history-item.active { background: var(--panel2); }
.history-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  font-size: 13px;
}
.delete-chat { padding: 5px 8px; }
.sidebar-bottom {
  margin-top: auto;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}
.main {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
}
.topbar {
  min-height: 62px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(8,13,11,.85);
}
#menuBtn { display: none; }
.topbar-title { font-weight: 700; }
.status {
  margin-left: auto;
  color: var(--green);
  font-size: 12px;
}
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 28px 18px;
  scroll-behavior: smooth;
}
.inner { max-width: 790px; margin: 0 auto; }
.welcome {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px 0;
}
.welcome-logo {
  font-size: 43px;
  color: var(--green);
  text-shadow: 0 0 25px #36e98244;
  margin-bottom: 8px;
}
.welcome h1 { font-size: clamp(26px, 5vw, 38px); margin: 0 0 12px; }
.welcome p { color: var(--muted); max-width: 440px; line-height: 1.6; }
.suggestions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;
  margin-top: 18px;
  width: 100%;
  max-width: 540px;
}
.suggestion { text-align: left; padding: 14px; line-height: 1.4; }
.message {
  display: flex;
  gap: 12px;
  margin: 0 0 24px;
  align-items: flex-start;
}
.avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: var(--panel2);
  color: var(--green);
  font-weight: 800;
}
.message.user .avatar {
  background: #24382b;
  color: white;
}
.message-content { min-width: 0; flex: 1; padding-top: 4px; }
.message-name { font-size: 12px; color: var(--muted); margin-bottom: 7px; }
.message-text {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.65;
}
.message-text img {
  max-width: 100%;
  max-height: 260px;
  display: block;
  border-radius: 10px;
  margin-top: 10px;
}
.composer-area {
  padding: 10px 18px 16px;
  background: linear-gradient(transparent, rgba(8,13,11,.97) 20%);
}
.composer-wrap { max-width: 790px; margin: 0 auto; }
.attachments {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.attachment {
  border: 1px solid var(--border);
  padding: 6px 9px;
  border-radius: 8px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  gap: 8px;
  align-items: center;
}
.attachment button { padding: 0 4px; border: 0; background: transparent; }
.composer {
  border: 1px solid #35483b;
  background: rgba(16,23,19,.98);
  border-radius: 17px;
  padding: 10px;
}
#messageInput {
  width: 100%;
  resize: none;
  min-height: 45px;
  max-height: 150px;
  color: var(--text);
  background: transparent;
  border: 0;
  outline: 0;
  padding: 9px 7px;
}
.tools {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
}
.tool-btn { padding: 8px 10px; font-size: 13px; }
#sendBtn { margin-left: auto; min-width: 75px; }
.hint { text-align: center; color: var(--muted); font-size: 11px; margin-top: 9px; }
#fileInput { display: none; }
#notice {
  font-size: 12px;
  color: var(--green);
  min-height: 17px;
  margin: 4px 0;
}
@media (max-width: 650px) {
  .sidebar {
    position: fixed;
    z-index: 5;
    top: 0; bottom: 0; left: 0;
    transform: translateX(-105%);
    transition: transform .2s;
    box-shadow: 15px 0 40px #0008;
  }
  .sidebar.open { transform: translateX(0); }
  #menuBtn { display: inline-block; }
  .topbar { padding: 10px 12px; }
  .chat { padding: 20px 13px; }
  .composer-area { padding: 8px 10px 12px; }
  .suggestions { grid-template-columns: 1fr; }
  .tool-btn { padding: 8px; font-size: 12px; }
  .message { gap: 9px; }
}
</style>
</head>

<body>
<canvas id="matrix"></canvas>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">N</span> NOVA-IA</div>
    <button class="primary" id="newChatBtn">＋ Nuevo chat</button>
    <div class="section-label">Conversaciones</div>
    <div id="history"></div>
    <div class="sidebar-bottom">
      NOVA-IA · Versión web<br>
      Tus conversaciones se guardan en este navegador.
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" aria-label="Abrir menú">☰</button>
      <div class="topbar-title">NOVA-IA</div>
      <div class="status">● Lista</div>
    </header>

    <section class="chat" id="chat">
      <div class="inner" id="messages"></div>
    </section>

    <div class="composer-area">
      <div class="composer-wrap">
        <div id="notice" role="status"></div>
        <div class="attachments" id="attachments"></div>
        <div class="composer">
          <textarea id="messageInput" rows="1"
            placeholder="Escribe un mensaje a NOVA-IA..."
            aria-label="Escribe tu mensaje"></textarea>
          <div class="tools">
            <button class="tool-btn" id="fileBtn">＋ Archivo</button>
            <input id="fileInput" type="file" multiple
              accept="image/*,.txt,.md,.csv,.json,.html,.css,.js,.xml,.log">
            <button class="tool-btn" id="dictateBtn">🎙 Dictar</button>
            <button class="tool-btn" id="readBtn">🔊 Leer</button>
            <button class="primary" id="sendBtn">Enviar ↑</button>
          </div>
        </div>
        <div class="hint">Enter para enviar · Shift + Enter para nueva línea</div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const STORAGE_KEY = "nova_ia_chats_v1";

  const ui = {
    sidebar: $("sidebar"),
    history: $("history"),
    messages: $("messages"),
    chat: $("chat"),
    input: $("messageInput"),
    send: $("sendBtn"),
    attachments: $("attachments"),
    fileInput: $("fileInput"),
    notice: $("notice")
  };

  let chats = [];
  let currentId = null;
  let pendingFiles = [];
  let busy = false;
  let recognition = null;

  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function notify(message) {
    ui.notice.textContent = message || "";
  }

  function save() {
    try {
      // Las conversaciones se guardan sin datos binarios de imágenes.
      localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
    } catch (error) {
      notify("No se pudo guardar el historial. Puede faltar espacio.");
    }
  }

  function activeChat() {
    return chats.find(c => c.id === currentId);
  }

  function createChat() {
    const chat = { id: makeId(), title: "Nuevo chat", messages: [] };
    chats.unshift(chat);
    currentId = chat.id;
    pendingFiles = [];
    save();
    renderAll();
    ui.input.focus();
    ui.sidebar.classList.remove("open");
  }

  function escapeText(value) {
    return String(value ?? "");
  }

  function renderHistory() {
    ui.history.replaceChildren();

    chats.forEach(chat => {
      const row = document.createElement("div");
      row.style.display = "flex";
      row.style.gap = "4px";

      const open = document.createElement("button");
      open.className = "history-item" + (chat.id === currentId ? " active" : "");
      open.style.flex = "1";
      open.innerHTML = '<span class="history-title"></span>';
      open.querySelector(".history-title").textContent = chat.title || "Nuevo chat";
      open.addEventListener("click", () => {
        currentId = chat.id;
        pendingFiles = [];
        renderAll();
        ui.sidebar.classList.remove("open");
      });

      const del = document.createElement("button");
      del.className = "delete-chat";
      del.textContent = "×";
      del.title = "Eliminar conversación";
      del.setAttribute("aria-label", "Eliminar conversación");
      del.addEventListener("click", () => {
        chats = chats.filter(c => c.id !== chat.id);
        if (currentId === chat.id) currentId = chats[0]?.id || null;
        if (!currentId) createChat();
        else { save(); renderAll(); }
      });

      row.append(open, del);
      ui.history.append(row);
    });
  }

  function renderMessages() {
    ui.messages.replaceChildren();
    const chat = activeChat();

    if (!chat || chat.messages.length === 0) {
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.innerHTML = `
        <div class="welcome-logo">✳</div>
        <h1>Hola, soy NOVA-IA</h1>
        <p>Tu asistente web. Escribe un mensaje para comenzar. También puedes usar el dictado o adjuntar archivos.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Explícame algo interesante sobre el universo">🌌 Aprende algo nuevo</button>
          <button class="suggestion" data-prompt="Ayúdame a estudiar para un examen">📚 Ayuda para estudiar</button>
          <button class="suggestion" data-prompt="Dame ideas para un proyecto creativo">💡 Ideas creativas</button>
          <button class="suggestion" data-prompt="¿Qué puedes hacer en esta versión?">🤖 ¿Qué puedes hacer?</button>
        </div>`;
      welcome.querySelectorAll("[data-prompt]").forEach(button => {
        button.addEventListener("click", () => {
          ui.input.value = button.dataset.prompt;
          sendMessage();
        });
      });
      ui.messages.append(welcome);
      return;
    }

    chat.messages.forEach(message => {
      const item = document.createElement("article");
      item.className = "message " + (message.role === "user" ? "user" : "assistant");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = message.role === "user" ? "Tú" : "N";

      const content = document.createElement("div");
      content.className = "message-content";

      const name = document.createElement("div");
      name.className = "message-name";
      name.textContent = message.role === "user" ? "Tú" : "NOVA-IA";

      const text = document.createElement("div");
      text.className = "message-text";
      text.textContent = escapeText(message.text);

      content.append(name, text);

      if (message.imageData && message.role === "user") {
        const img = document.createElement("img");
        img.src = message.imageData;
        img.alt = message.fileName || "Imagen adjunta";
        content.append(img);
      } else if (message.fileName) {
        const fileLabel = document.createElement("div");
        fileLabel.style.color = "var(--muted)";
        fileLabel.style.fontSize = "12px";
        fileLabel.style.marginTop = "8px";
        fileLabel.textContent = "Archivo: " + message.fileName;
        content.append(fileLabel);
      }

      item.append(avatar, content);
      ui.messages.append(item);
    });

    ui.chat.scrollTop = ui.chat.scrollHeight;
  }

  function renderAttachments() {
    ui.attachments.replaceChildren();

    pendingFiles.forEach((file, index) => {
      const item = document.createElement("div");
      item.className = "attachment";

      const name = document.createElement("span");
      name.textContent = file.name;

      const remove = document.createElement("button");
      remove.textContent = "×";
      remove.title = "Quitar archivo";
      remove.addEventListener("click", () => {
        pendingFiles.splice(index, 1);
        renderAttachments();
      });

      item.append(name, remove);
      ui.attachments.append(item);
    });
  }

  function renderAll() {
    renderHistory();
    renderMessages();
    renderAttachments();
  }

  function localReply(input, files) {
    const text = input.toLowerCase().trim();

    if (/^(hola|holi|hey|buenas|buenos días|buenas tardes|buenas noches)[!. ]*$/.test(text)) {
      return "¡Hola! 👋 Soy NOVA-IA. ¿En qué te puedo ayudar hoy?";
    }

    if (text.includes("qué puedes hacer") || text.includes("que puedes hacer")) {
      return "En esta versión puedo mantener conversaciones básicas, guardar el historial en este navegador, leer respuestas en voz alta, usar dictado si tu navegador lo admite y mostrar archivos adjuntos. Todavía no estoy conectada a un modelo avanzado, así que no puedo razonar como ChatGPT ni analizar realmente el contenido de imágenes.";
    }

    if (text.includes("quién eres") || text.includes("quien eres")) {
      return "Soy NOVA-IA, un asistente web creado con HTML, CSS y JavaScript. Esta versión funciona sin un servidor propio, pero mis respuestas son limitadas.";
    }

    if (text.includes("gracias")) {
      return "¡Con gusto! 😊 ¿En qué más te puedo ayudar?";
    }

    if (files.length) {
      const names = files.map(f => f.name).join(", ");
      const textFiles = files.filter(f => f.textContent).map(f =>
        "\n\nContenido de " + f.name + ":\n" + f.textContent.slice(0, 3500)
      ).join("");

      if (textFiles) {
        return "He podido leer el texto de los archivos seleccionados: " + names +
          ".\n\nContenido disponible para revisar:\n" + textFiles +
          "\n\nNota: esta versión no tiene un modelo de IA conectado para hacer un análisis inteligente.";
      }

      return "Has adjuntado: " + names +
        ". Puedo mostrar la imagen o el nombre del archivo, pero esta versión no tiene un modelo conectado para interpretar imágenes.";
    }

    if (!input.trim()) {
      return "Escribe una pregunta o un mensaje para comenzar.";
    }

    return "He recibido tu mensaje: «" + input + "».\n\nLa interfaz de NOVA-IA ya puede responder, pero todavía no tiene conectado un modelo de inteligencia artificial avanzado. Para responder preguntas variadas y razonar de verdad, habría que integrar un modelo compatible.";
  }

  async function sendMessage() {
    if (busy) return;

    const input = ui.input.value.trim();
    if (!input && pendingFiles.length === 0) {
      notify("Escribe un mensaje o adjunta un archivo.");
      ui.input.focus();
      return;
    }

    if (!activeChat()) createChat();

    const chat = activeChat();
    const files = pendingFiles.slice();

    const fileSummary = files.map(f => ({
      name: f.name,
      textContent: f.textContent || "",
      imageData: f.imageData || ""
    }));

    const userMessage = {
      role: "user",
      text: input || "He adjuntado un archivo.",
      fileName: files.map(f => f.name).join(", "),
      imageData: files.find(f => f.imageData)?.imageData || ""
    };

    chat.messages.push(userMessage);

    if (chat.messages.length === 1) {
      chat.title = (input || files[0]?.name || "Nuevo chat").slice(0, 32);
    }

    ui.input.value = "";
    ui.input.style.height = "45px";
    pendingFiles = [];
    busy = true;
    ui.send.disabled = true;
    ui.send.textContent = "…";
    notify("NOVA-IA está preparando una respuesta…");
    save();
    renderAll();

    // Permite actualizar la pantalla antes de generar la respuesta local.
    await new Promise(resolve => setTimeout(resolve, 250));

    try {
      const reply = localReply(input, fileSummary);
      chat.messages.push({ role: "assistant", text: reply });
      save();
      renderAll();
      notify("");
    } catch (error) {
      chat.messages.push({
        role: "assistant",
        text: "Ha ocurrido un error al preparar la respuesta. Inténtalo otra vez."
      });
      save();
      renderAll();
    } finally {
      busy = false;
      ui.send.disabled = false;
      ui.send.textContent = "Enviar ↑";
      ui.input.focus();
    }
  }

  $("newChatBtn").addEventListener("click", createChat);
  $("menuBtn").addEventListener("click", () => ui.sidebar.classList.toggle("open"));
  ui.send.addEventListener("click", sendMessage);

  ui.input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  ui.input.addEventListener("input", () => {
    ui.input.style.height = "45px";
    ui.input.style.height = Math.min(ui.input.scrollHeight, 150) + "px";
  });

  $("fileBtn").addEventListener("click", () => ui.fileInput.click());

  ui.fileInput.addEventListener("change", async event => {
    const files = Array.from(event.target.files || []);

    for (const file of files) {
      if (file.size > 2 * 1024 * 1024) {
        notify(file.name + " supera el límite de 2 MB.");
        continue;
      }

      const item = { name: file.name, textContent: "", imageData: "" };

      try {
        if (file.type.startsWith("image/")) {
          item.imageData = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        } else {
          const allowed = /\.(txt|md|csv|json|html|css|js|xml|log)$/i.test(file.name);
          if (!allowed) {
            notify("Tipo de archivo no admitido: " + file.name);
            continue;
          }
          item.textContent = await file.text();
        }

        pendingFiles.push(item);
      } catch {
        notify("No se pudo leer " + file.name);
      }
    }

    renderAttachments();
    ui.fileInput.value = "";
    if (pendingFiles.length) notify("Archivo preparado. Pulsa Enviar para adjuntarlo.");
  });

  $("dictateBtn").addEventListener("click", () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      notify("Tu navegador no admite dictado. Prueba Chrome y permite el acceso al micrófono.");
      return;
    }

    if (recognition) {
      recognition.stop();
      recognition = null;
      notify("
