<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cristomicina V1.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:56px;background:#151515;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0}
.logo{font-weight:800;display:flex;gap:8px;align-items:center}
.logo span{width:28px;height:28px;background:#a855f7;border-radius:6px;display:flex;align-items:center;justify-content:center}
.btn{width:36px;height:36px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:8px;color:#fff;cursor:pointer}
.app{flex:1;display:flex;overflow:hidden;position:relative}
.sidebar{width:280px;background:#151515;border-right:1px solid #222;position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.3s;z-index:10;display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
@media(min-width:800px){.sidebar{position:relative;transform:none}}
.history{flex:1;overflow:auto;padding:10px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#msgs{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:12px}
#msgs.show{display:flex!important}
.bubble{max-width:85%;padding:12px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.user{align-self:flex-end;background:#a855f7}
.ai{align-self:flex-start;background:#1e1e1e;border:1px solid #2a2a2a}
.bubble img{max-width:100%;margin-top:8px;border-radius:8px}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:500px;width:100%;margin-top:14px}
.sug{background:#151515;border:1px solid #222;border-radius:10px;padding:12px;cursor:pointer;font-size:13px}
.input-area{background:#151515;border-top:1px solid #222;padding:10px;flex-shrink:0;position:relative;z-index:5}
.prev{display:none;margin-bottom:8px}.prev.on{display:block}
.prev img{width:60px;height:60px;border-radius:8px;object-fit:cover}
.row{display:flex;gap:6px;align-items:center;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:24px;padding:6px}
textarea{flex:1;background:transparent;border:none;color:#fff;outline:none;resize:none;max-height:100px;padding:6px;font-size:15px}
.ib{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.send{background:#a855f7;color:#fff}
</style>
</head>
<body>
<header><div class="logo"><span>C</span>Cristomicina V1.2</div><div><button class="btn" id="bHist">☰</button> <button class="btn" id="bNew">+</button></div></header>
<div class="app">
<div class="sidebar" id="sidebar"><div style="padding:10px;border-bottom:1px solid #222"><b>Historial</b></div><div class="history" id="hist"></div></div>
<div class="main">
<div id="welcome">
<h2>Hola, soy Cristomicina</h2>
<p style="color:#888;font-size:13px;margin-top:6px">Chat + Imágenes + Voz - GitHub Pages</p>
<div class="sugs">
<div class="sug" data-t="Quiero aprender algo nuevo">📚 Aprender algo nuevo</div>
<div class="sug" data-t="Resuelve este problema: ">🧩 Resolver un problema</div>
<div class="sug" data-t="Dame ideas para ">💡 Crear ideas</div>
<div class="sug" data-t="Resume este texto: ">📝 Resumir un texto</div>
</div>
</div>
<div id="msgs"></div>
<div class="input-area">
<div class="prev" id="prev"><img id="prevImg"><button id="delImg" style="position:absolute;margin-left:4px;background:red;border:none;color:#fff;border-radius:50%;width:18px;height:18px">×</button></div>
<div class="row">
<button class="ib" id="bAttach" style="background:transparent;color:#aaa">📎</button>
<textarea id="inp" placeholder="Escribe aquí..." rows="1"></textarea>
<button class="ib" id="bMic" style="background:transparent;color:#aaa">🎤</button>
<button class="ib send" id="bSend">➤</button>
</div>
</div>
</div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<script>
let cur=null;
let convs=JSON.parse(localStorage.getItem('cristomicina_convs')||'[]');
let imgB64=null;
let rec=null, listening=false;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function save(){localStorage.setItem('cristomicina_convs',JSON.stringify(convs))}

function showChat(){
$('welcome').style.display='none';
$('msgs').classList.add('show');
$('msgs').style.display='flex';
}

function newChat(){
cur=Date.now().toString();
convs.push({id:cur,title:'Nuevo chat',messages:[]});
save();
$('welcome').style.display='none';
$('msgs').classList.add('show');
$('msgs').style.display='flex';
$('msgs').innerHTML='';
$('sidebar').classList.remove('open');
}

function addBubble(role,text,img){
showChat();
const d=document.createElement('div');
d.className='bubble '+role;
let h=esc(text);
if(img) h+=`<br><img src="${img}">`;
d.innerHTML=h;
$('msgs').appendChild(d);
$('msgs').scrollTop=$('msgs').scrollHeight;
if(cur){
let c=convs.find(x=>x.id===cur);
if(c){c.messages.push({role,text,img}); if(c.messages.length===1) c.title=text.slice(0,35); save();}
}
}

function send(){
let txt=$('inp').value.trim();
if(!txt && !imgB64) return;
if(!cur) newChat();
else showChat();
const imgSend=imgB64;
addBubble('user',txt||'Mira esta imagen',imgSend);
$('inp').value='';
$('inp').style.height='auto';
clearImg();

const load=document.createElement('div');
load.className='bubble ai';
load.id='load';
load.textContent='Escribiendo...';
$('msgs').appendChild(load);
$('msgs').scrollTop=$('msgs').scrollHeight;

setTimeout(()=>{
let l=$('load'); if(l) l.remove();
let gKey=localStorage.getItem('cristomicina_groq')||'';
if(gKey){
fetch('https://api.groq.com/openai/v1/chat/completions',{
method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Bearer '+gKey},
body:JSON.stringify({model:'llama-3.1-8b-instant',messages:[{role:'user',content:txt}]})
}).then(r=>r.json()).then(j=>{
if(j.error) throw new Error(j.error.message);
addBubble('ai',j.choices[0].message.content,null);
}).catch(e=>{addBubble('ai','Error: '+e.message,null)});
}else{
addBubble('ai',`¡Hola! Recibí: "${txt}"${imgSend?' + imagen':''}\n\n✅ MENSAJES FUNCIONANDO\n✅ IMÁGENES FUNCIONANDO\n✅ AUDIO FUNCIONANDO\n\nTu chat ya envía. Estoy en modo local seguro porque no has puesto clave Groq.\n\nPara IA real: ve a console.groq.com/keys > crea gsk_... y la pegas en mi código en localStorage (te explico si quieres). Pero el envío ya está arreglado.`,null);
}
},400);
}

function clearImg(){imgB64=null; $('prev').classList.remove('on'); $('file').value=''; $('prevImg').src='';}

$('bSend').addEventListener('click',(e)=>{e.preventDefault(); send();});
$('bSend').addEventListener('touchend',(e)=>{e.preventDefault(); send();});
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); send();}});
$('bAttach').onclick=()=>$('file').click();
$('file').onchange=e=>{
const f=e.target.files[0]; if(!f) return;
const r=new FileReader();
r.onload=ev=>{
const im=new Image();
im.onload=()=>{
let c=document.createElement('canvas'); let w=im.width,h=im.height; let max=1024;
if(w>max||h>max){if(w>h){h=h*max/w;w=max}else{w=w*max/h;h=max}}
c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
imgB64=c.toDataURL('image/jpeg',0.8);
$('prevImg').src=imgB64; $('prev').classList.add('on');
};
im.src=ev.target.result;
};
r.readAsDataURL(f);
};
$('delImg').onclick=clearImg;
$('bNew').onclick=newChat;
$('bHist').onclick=()=>$('sidebar').classList.toggle('open');
document.querySelectorAll('.sug').forEach(s=>s.onclick=()=>{$('inp').value=s.dataset.t; $('inp').focus();});
$('bMic').onclick=()=>{
if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)) return alert('Usa Chrome y HTTPS. Tu link ya es https, solo permite micro.');
if(listening){rec.stop(); return}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; rec=new SR(); rec.lang='es-ES';
rec.onstart=()=>{listening=true; $('bMic').textContent='⏹'; $('bMic').style.color='red';};
rec.onend=()=>{listening=false; $('bMic').textContent='🎤'; $('bMic').style.color='#aaa';};
rec.onresult=e=>{$('inp').value+=e.results[0][0].transcript;};
rec.start();
};
</script>
</body>
</html>
